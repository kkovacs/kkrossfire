<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; font: 13px/1.5 system-ui, sans-serif;
      background: #1e1f22; color: #e8e8e8;
      display: flex; flex-direction: column; height: 100vh;
    }
    header {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto;
      column-gap: 8px; padding: 10px 12px; background: #26272b; border-bottom: 1px solid #333;
    }
    .brand { grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: 4px; min-width: 0; }
    .title { font-weight: 600; }
    .tab { grid-column: 1 / -1; grid-row: 2; min-width: 0; font-size: 11px; color: #999; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .buttons { grid-column: 2; grid-row: 1; display: flex; gap: 6px; align-self: start; }
    .iconButton { background: transparent; color: #aaa; padding: 2px; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; }
    .iconButton:hover, .iconButton:focus-visible { background: #3a3c42; color: #fff; }
    #settings { padding: 10px 12px 6px; background: #26272b; border-bottom: 1px solid #333; display: flex; flex-direction: column; gap: 6px; }
    #settings label { font-size: 12px; color: #bbb; display: flex; flex-direction: column; gap: 3px; }
    #settings label.check { flex-direction: row; align-items: center; gap: 6px; }
    .settingsRow { display: flex; gap: 6px; align-items: center; }
    .settingsHint { font-size: 11px; color: #8a8f98; }
    #settingsStatus { font-size: 11px; color: #8a8f98; word-break: break-word; }
    #settingsStatus:empty { display: none; }
    #settingsStatus.ok { color: #7ee081; }
    #settingsStatus.error { color: #e06c6c; }
    input[type="text"], input[type="password"], textarea {
      background: #1e1f22; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 8px; font: inherit; width: 100%;
    }
    textarea { resize: vertical; min-height: 60px; }
    button { background: #2d5bd7; color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
    button.secondary { background: #3a3c42; }
    #resetBtn.away { background: #2d5bd7; }
    button:disabled { opacity: .45; cursor: default; }
    #chat { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    .msg { position: relative; padding: 7px 10px; border-radius: 8px; max-width: 100%; word-break: break-word; }
    .msg.user { background: #2d5bd7; align-self: flex-end; }
    .msg.assistant { background: #2b2d31; align-self: flex-start; }
    .msgActions { position: absolute; top: 4px; right: 4px; display: flex; gap: 2px; opacity: 0; pointer-events: none; transition: opacity .12s; }
    .msg:hover .msgActions, .msg:focus-within .msgActions { opacity: 1; pointer-events: auto; }
    .msgActions button { width: 22px; height: 22px; padding: 0; border-radius: 4px; background: transparent; color: #9da1aa; font-size: 14px; line-height: 1; }
    .msg.user .msgActions button { background: #2d5bd7; }
    .msg.assistant .msgActions button { background: #2b2d31; }
    .msgActions button:hover, .msgActions button:focus-visible { background: rgba(255,255,255,.14); color: #fff; }
    .msg.step { background: transparent; color: #8a8f98; font-size: 11px; font-style: italic; padding: 2px 4px; align-self: flex-start; }
    .msg code { background: #111; padding: 1px 4px; border-radius: 4px; }
    .msg.typing { display: inline-flex; align-items: center; gap: 4px; padding: 12px 14px; }
    .msg.typing span { width: 6px; height: 6px; border-radius: 50%; background: #8a8f98; animation: bounce 1.2s infinite ease-in-out; }
    .msg.typing span:nth-child(2) { animation-delay: .15s; }
    .msg.typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
    #busy { display: inline-flex; align-items: center; gap: 6px; color: #8a8f98; font-size: 12px; white-space: nowrap; }
    #busy .spin { width: 12px; height: 12px; border: 2px solid #555; border-top-color: #2d5bd7; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid #333; background: #26272b; }
    #prompt { flex: 1; }
    #toast {
      position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%);
      background: #3a3c42; color: #fff; padding: 6px 12px; border-radius: 8px;
      font-size: 12px; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.4);
      pointer-events: none; max-width: 90%; text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="title">KKrossfire</div>
      <button id="settingsBtn" class="iconButton" title="Open settings" aria-label="Open settings">⚙</button>
    </div>
    <div class="tab" id="tabInfo">no workspace tab</div>
    <div class="buttons">
      <button id="resetBtn" class="secondary away" title="Reset session">Reset to current tab</button>
    </div>
  </header>

  <section id="settings" hidden>
    <label>API URL
      <input id="apiUrl" type="text" placeholder="https://openrouter.ai/api/v1">
    </label>
    <label>API KEY
      <input id="apiKey" type="password" placeholder="sk-or-v1-...">
    </label>
    <label>Model
      <input id="model" type="text">
    </label>
    <label>SYSTEM prompt
      <textarea id="systemPrompt" rows="6"></textarea>
    </label>
    <div class="settingsRow">
      <button id="saveSettings">Save</button>
      <button id="testConnection" class="secondary">Test connection</button>
    </div>
    <span id="settingsStatus"></span>
    <small class="settingsHint">Change the hotkey at chrome://extensions/shortcuts</small>
  </section>

  <main id="chat"></main>

  <footer>
    <input id="prompt" type="text" placeholder="Ask AI…" autofocus disabled>
    <span id="busy" hidden><span class="spin"></span> Working…</span>
    <button id="send" disabled>Send</button>
    <button id="stop" class="secondary" hidden>Stop</button>
  </footer>

  <div id="toast" hidden></div>

  <script src="config.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
